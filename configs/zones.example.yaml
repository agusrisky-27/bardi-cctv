# RCIS zones & door line (contoh untuk simulasi di ruang meeting).
# Buat versi sendiri dari frame kamera asli:  python scripts/draw_zones.py --source <video|rtsp|0>
# Hasilnya configs/zones.yaml (dipakai pipeline). File ini hanya contoh.
#
# coordinate_format:
#   normalized -> [x, y] dalam 0.0-1.0 (ikut berubah kalau resolusi stream berubah)
#   absolute   -> [x, y] piksel
# PERINGATAN PTZ: zona hanya valid untuk satu posisi kamera. Jika kamera diputar, gambar ulang zona.
#
# kind zona:
#   table      -> meja (dipakai untuk status duduk, dwell di meja, sesi meja, waktu tunggu makanan)
#   door       -> area pintu
#   cashier    -> kasir
#   queue      -> antrean
#   staff      -> area staf (dipakai heuristik pelayan vs pelanggan)
#   restricted -> zona terlarang (dapur/gudang) untuk alert keamanan
#   area       -> zona umum lain

coordinate_format: "normalized"

# Garis pintu. Arah "in"/"out" mengikuti supervision.LineZone:
# jika hitungan masuk/keluar terbalik, tukar start dan end.
door_line:
  start: [0.05, 0.80]
  end: [0.30, 0.80]

zones:
  - name: "pintu"
    kind: "door"
    polygon: [[0.02, 0.65], [0.33, 0.65], [0.33, 0.98], [0.02, 0.98]]

  - name: "meja_1"
    kind: "table"
    polygon: [[0.38, 0.40], [0.65, 0.40], [0.65, 0.75], [0.38, 0.75]]

  - name: "meja_2"
    kind: "table"
    polygon: [[0.68, 0.40], [0.95, 0.40], [0.95, 0.75], [0.68, 0.75]]

  - name: "kasir"
    kind: "cashier"
    polygon: [[0.38, 0.10], [0.62, 0.10], [0.62, 0.35], [0.38, 0.35]]

  - name: "gudang"
    kind: "restricted"
    polygon: [[0.70, 0.05], [0.98, 0.05], [0.98, 0.35], [0.70, 0.35]]
